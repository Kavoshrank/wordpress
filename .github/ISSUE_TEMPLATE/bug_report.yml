name: Bug Report
description: Report a defect or unexpected behavior in the KavoshRank WordPress Plugin
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible to help us reproduce and fix it quickly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to 'KavoshRank > Settings'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: wp_version
    attributes:
      label: WordPress Version
      placeholder: "e.g. 6.7"
    validations:
      required: true
  - type: input
    id: php_version
    attributes:
      label: PHP Version
      placeholder: "e.g. 8.2.14"
    validations:
      required: true
  - type: input
    id: plugin_version
    attributes:
      label: Plugin Version
      placeholder: "e.g. 1.0.1"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Logs or Screenshots
      description: Paste relevant debug logs or error traces. Please redact any private site tokens or credentials.
